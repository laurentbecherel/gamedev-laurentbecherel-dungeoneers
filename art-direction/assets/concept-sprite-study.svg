<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Retro sprite and modern material study</title>
  <desc id="desc">A chunky 64 pixel torch sprite shown as albedo, normal, ORM, height and final dynamically lit result.</desc>
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <linearGradient id="normal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#547bd0"/><stop offset=".5" stop-color="#7b83d9"/><stop offset="1" stop-color="#c07ccd"/></linearGradient>
    <linearGradient id="orm" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d0d0d0"/><stop offset=".5" stop-color="#777"/><stop offset="1" stop-color="#111"/></linearGradient>
    <linearGradient id="height" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#101010"/><stop offset="1" stop-color="#f0f0f0"/></linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="620" fill="#0b0d0d"/>
  <text x="48" y="60" fill="#d6dad7" font-family="ui-monospace,monospace" font-size="22" letter-spacing="4">SPRITE / SURFACE STUDY</text>
  <text x="48" y="91" fill="#7f8883" font-family="ui-monospace,monospace" font-size="14" letter-spacing="2">CHUNKY SILHOUETTE IN · PHYSICAL RESPONSE OUT</text>
  <g transform="translate(48 132)" shape-rendering="crispEdges">
    <rect width="290" height="420" fill="#151918" stroke="#343a37" stroke-width="2"/>
    <circle cx="145" cy="175" r="118" fill="#a4522d" opacity=".24" filter="url(#blur)"/>
    <g transform="translate(65 55) scale(5)">
      <path d="M10 52H34V58H10Z" fill="#202322"/><path d="M14 43H30V53H14Z" fill="#493126"/><path d="M18 22H26V46H18Z" fill="#875034"/>
      <path d="M18 22H26V29H18Z" fill="#d17438"/><path d="M21 2H27V9H31V18H27V24H16V18H12V11H16V6H21Z" fill="#9b472a"/>
      <path d="M21 5H27V12H24V21H17V15H19Z" fill="#ed8438"/><path d="M23 7H27V13H24V17H21V12Z" fill="#ffd08a"/>
      <path d="M16 31H28V34H16ZM13 37H31V40H13Z" fill="#242827"/>
    </g>
    <rect width="290" height="420" fill="url(#grid)"/>
    <text x="18" y="397" fill="#d5d9d6" font-family="ui-monospace,monospace" font-size="15" letter-spacing="2">FINAL / DYNAMIC</text>
  </g>
  <g transform="translate(378 132)" shape-rendering="crispEdges" font-family="ui-monospace,monospace">
    <g><rect width="170" height="190" fill="#151918" stroke="#343a37" stroke-width="2"/><g transform="translate(42 20) scale(2.7)"><path d="M11 48H37V55H11Z" fill="#1e211f"/><path d="M16 25H31V49H16Z" fill="#74442f"/><path d="M22 2H29V9H33V19H28V25H16V18H12V11H17V5H22Z" fill="#d86c32"/><path d="M23 6H28V14H25V21H19V14H21Z" fill="#ffd08a"/></g><text x="15" y="174" fill="#bbb" font-size="13">ALBEDO</text></g>
    <g transform="translate(190 0)"><rect width="170" height="190" fill="#151918" stroke="#343a37" stroke-width="2"/><g transform="translate(42 20) scale(2.7)"><path d="M11 48H37V55H11Z" fill="#5f68bf"/><path d="M16 25H31V49H16Z" fill="url(#normal)"/><path d="M22 2H29V9H33V19H28V25H16V18H12V11H17V5H22Z" fill="#7f82dd"/><path d="M23 6H28V14H25V21H19V14H21Z" fill="#a984db"/></g><text x="15" y="174" fill="#bbb" font-size="13">NORMAL</text></g>
    <g transform="translate(380 0)"><rect width="170" height="190" fill="#151918" stroke="#343a37" stroke-width="2"/><g transform="translate(42 20) scale(2.7)"><path d="M11 48H37V55H11Z" fill="#444"/><path d="M16 25H31V49H16Z" fill="url(#orm)"/><path d="M22 2H29V9H33V19H28V25H16V18H12V11H17V5H22Z" fill="#ccc"/><path d="M23 6H28V14H25V21H19V14H21Z" fill="#fff"/></g><text x="15" y="174" fill="#bbb" font-size="13">ORM</text></g>
    <g transform="translate(570 0)"><rect width="170" height="190" fill="#151918" stroke="#343a37" stroke-width="2"/><g transform="translate(42 20) scale(2.7)"><path d="M11 48H37V55H11Z" fill="#222"/><path d="M16 25H31V49H16Z" fill="url(#height)"/><path d="M22 2H29V9H33V19H28V25H16V18H12V11H17V5H22Z" fill="#bdbdbd"/><path d="M23 6H28V14H25V21H19V14H21Z" fill="#fff"/></g><text x="15" y="174" fill="#bbb" font-size="13">HEIGHT</text></g>
    <g transform="translate(0 230)">
      <rect width="740" height="190" fill="#111413" stroke="#343a37" stroke-width="2"/>
      <path d="M32 72H708" stroke="#3d4541" stroke-width="2" stroke-dasharray="3 8"/>
      <g fill="#d3d7d4" font-size="14"><text x="28" y="36">AUTHOR AT 32–64 PX</text><text x="28" y="118">ANIMATE AT 6–10 FPS</text><text x="402" y="36">LIGHT AT FRAME RATE</text><text x="402" y="118">QUANTIZE AFTER COMPOSITE</text></g>
      <g fill="#6f7773"><rect x="28" y="53" width="270" height="8"/><rect x="28" y="135" width="270" height="8"/><rect x="402" y="53" width="270" height="8"/><rect x="402" y="135" width="270" height="8"/></g>
      <g fill="#d06f36"><rect x="28" y="53" width="92" height="8"/><rect x="28" y="135" width="181" height="8"/><rect x="402" y="53" width="244" height="8"/><rect x="402" y="135" width="218" height="8"/></g>
      <text x="28" y="172" fill="#77817c" font-size="12" letter-spacing="1">PIXELS DEFINE THE OBJECT. LIGHT DEFINES ITS PRESENCE.</text>
    </g>
  </g>
</svg>
