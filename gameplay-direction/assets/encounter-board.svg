<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Trinity combat encounter diagram</title>
  <desc id="desc">A top-down tactical room showing a tank holding the doorway, a healer maintaining line of sight and a safe zone, two damage dealers flanking, and enemies telegraphing attacks.</desc>
  <defs>
    <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#171b19"/><path d="M80 0H0V80" fill="none" stroke="#3a423e" stroke-width="2"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <marker id="intent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#cb7040"/></marker>
    <marker id="ally" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#849b78"/></marker>
  </defs>
  <rect width="1400" height="760" fill="#080a0a"/>
  <text x="48" y="57" fill="#d7dbd8" font-family="ui-monospace,monospace" font-size="21" letter-spacing="4">ENCOUNTER PLATE / CLAIM THE ROOM</text>
  <text x="48" y="88" fill="#75807a" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">READ INTENT → SET THE FRONT → CREATE SAFETY → COMMIT DAMAGE</text>

  <g transform="translate(48 125)" shape-rendering="crispEdges">
    <rect width="880" height="560" fill="url(#tiles)" stroke="#4a534e" stroke-width="4"/>
    <!-- walls and doorway -->
    <path d="M0 0H880V40H0ZM0 520H880V560H0ZM0 0H40V560H0ZM840 0H880V560H840Z" fill="#343b37"/>
    <path d="M0 240H280V320H0ZM600 240H880V320H600Z" fill="#4c5550"/>
    <path d="M280 240H600V320H280Z" fill="#111412" stroke="#69736e" stroke-width="4"/>
    <!-- healer safe zone -->
    <circle cx="440" cy="430" r="132" fill="#566d4c" opacity=".13" filter="url(#soft)"/>
    <circle cx="440" cy="430" r="112" fill="none" stroke="#69835b" stroke-width="5" stroke-dasharray="12 10"/>
    <!-- enemy telegraphs -->
    <path d="M440 105L440 283" stroke="#cb7040" stroke-width="18" opacity=".2"/>
    <path d="M440 105L440 271" stroke="#cb7040" stroke-width="5" marker-end="url(#intent)"/>
    <path d="M660 135L536 284" stroke="#cb7040" stroke-width="5" marker-end="url(#intent)"/>
    <path d="M220 135L344 284" stroke="#cb7040" stroke-width="5" marker-end="url(#intent)"/>
    <!-- enemy units -->
    <g font-family="ui-monospace,monospace" text-anchor="middle">
      <g transform="translate(440 105)"><path d="M0-35L31-18L31 18L0 35L-31 18L-31-18Z" fill="#6d3d2b" stroke="#cf7541" stroke-width="5"/><text y="6" fill="#fff" font-size="17">G</text></g>
      <g transform="translate(220 135)"><rect x="-27" y="-27" width="54" height="54" fill="#373c39" stroke="#a46040" stroke-width="5"/><text y="6" fill="#fff" font-size="15">A</text></g>
      <g transform="translate(660 135)"><rect x="-27" y="-27" width="54" height="54" fill="#373c39" stroke="#a46040" stroke-width="5"/><text y="6" fill="#fff" font-size="15">C</text></g>
    </g>
    <!-- player units -->
    <g font-family="ui-monospace,monospace" text-anchor="middle">
      <g transform="translate(440 285)"><path d="M0-38L34-20L34 20L0 38L-34 20L-34-20Z" fill="#384a52" stroke="#8aa1aa" stroke-width="6"/><text y="6" fill="#fff" font-size="17">T</text></g>
      <g transform="translate(440 430)"><circle r="34" fill="#42563d" stroke="#8aa277" stroke-width="6"/><text y="6" fill="#fff" font-size="17">H</text></g>
      <g transform="translate(270 350)"><path d="M0-34L32 25H-32Z" fill="#63542c" stroke="#d0ad4f" stroke-width="6"/><text y="9" fill="#fff" font-size="17">D</text></g>
      <g transform="translate(610 350)"><path d="M0-34L32 25H-32Z" fill="#63542c" stroke="#d0ad4f" stroke-width="6"/><text y="9" fill="#fff" font-size="17">D</text></g>
    </g>
    <!-- synergy arrows -->
    <path d="M414 406L425 321" stroke="#849b78" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#ally)"/>
    <path d="M303 333L401 302" stroke="#c9a84c" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#ally)"/>
    <path d="M577 333L479 302" stroke="#c9a84c" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#ally)"/>
    <!-- move paths -->
    <path d="M270 350Q190 295 210 220" fill="none" stroke="#c9a84c" stroke-width="4" stroke-dasharray="9 8"/>
    <path d="M610 350Q690 295 670 220" fill="none" stroke="#c9a84c" stroke-width="4" stroke-dasharray="9 8"/>
    <text x="440" y="501" fill="#71806f" font-family="ui-monospace,monospace" text-anchor="middle" font-size="12" letter-spacing="2">HEAL / CLEANSE / RECOVERY ZONE</text>
  </g>

  <g transform="translate(974 125)" font-family="ui-monospace,monospace">
    <text x="0" y="16" fill="#c9a84c" font-size="11" letter-spacing="2">THE TRINITY IS A CHAIN</text>
    <g transform="translate(0 48)"><rect width="378" height="122" fill="#111514" stroke="#303733"/><text x="20" y="31" fill="#8aa1aa" font-size="12">TANK / OWNS PRESSURE</text><text x="20" y="61" fill="#d6dad7" font-size="17">WHO IS HIT?</text><text x="20" y="88" fill="#78817c" font-size="12">TAUNT · BLOCK · GATHER · DISPLACE</text></g>
    <g transform="translate(0 186)"><rect width="378" height="122" fill="#111514" stroke="#303733"/><text x="20" y="31" fill="#8aa277" font-size="12">HEALER / OWNS STABILITY</text><text x="20" y="61" fill="#d6dad7" font-size="17">WHERE CAN WE STAY?</text><text x="20" y="88" fill="#78817c" font-size="12">HEAL · CLEANSE · ZONE · RESCUE</text></g>
    <g transform="translate(0 324)"><rect width="378" height="122" fill="#111514" stroke="#303733"/><text x="20" y="31" fill="#d0ad4f" font-size="12">DPS / OWNS THE CLOCK</text><text x="20" y="61" fill="#d6dad7" font-size="17">WHEN DOES IT END?</text><text x="20" y="88" fill="#78817c" font-size="12">BURST · FLANK · INTERRUPT · CLEAR</text></g>
    <g transform="translate(0 476)"><rect width="378" height="84" fill="#15130c" stroke="#7c6936"/><text x="20" y="31" fill="#c9a84c" font-size="11">SUCCESS CONDITION</text><text x="20" y="58" fill="#d6dad7" font-size="14">SPACE → SAFETY → DAMAGE</text></g>
  </g>
</svg>
