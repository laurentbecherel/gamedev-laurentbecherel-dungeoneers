<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">Rogue perks and rogue-lite loot progression</title>
  <desc id="desc">Each floor adds one temporary perk to the five-action kit, while extracted loot permanently improves bounded stats and mastery unlocks future perk choices.</desc>
  <defs>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34433b"/><stop offset="1" stop-color="#c7a64c"/></linearGradient>
    <linearGradient id="meta" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3c4850"/><stop offset="1" stop-color="#7f9eab"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#87908b" stroke-opacity=".04"/></pattern>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c9a84c"/></marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7f9eab"/></marker>
  </defs>
  <rect width="1500" height="700" fill="#080a0a"/><rect width="1500" height="700" fill="url(#grid)"/>
  <text x="48" y="57" fill="#d7dbd8" font-family="ui-monospace,monospace" font-size="21" letter-spacing="4">TWO PROGRESSION LAYERS / DIFFERENT JOBS</text>
  <text x="48" y="88" fill="#75807a" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">PERKS CREATE THE RUN. LOOT BUILDS THE CAREER.</text>

  <g transform="translate(48 135)" font-family="ui-monospace,monospace">
    <rect width="1404" height="226" fill="#0e1210" stroke="#3a433c"/>
    <text x="24" y="35" fill="#87a474" font-size="11" letter-spacing="2">ROGUE / RESETS ON EXTRACTION OR DEFEAT</text>
    <g transform="translate(24 67)">
      <g><rect width="198" height="120" fill="#172019" stroke="#657c5b"/><text x="16" y="29" fill="#8aa87a" font-size="10">FLOOR 01</text><text x="16" y="60" fill="#d5dad7" font-size="16">PERK × 1</text><text x="16" y="87" fill="#738078" font-size="11">FIRST TRANSFORM</text></g>
      <path d="M213 60H254" stroke="#c9a84c" stroke-width="3" marker-end="url(#arrowG)"/>
      <g transform="translate(270)"><rect width="198" height="120" fill="#191e16" stroke="#756c3b"/><text x="16" y="29" fill="#c9a84c" font-size="10">FLOOR 02</text><text x="16" y="60" fill="#d5dad7" font-size="16">PERKS × 2</text><text x="16" y="87" fill="#738078" font-size="11">SYNERGY STARTS</text></g>
      <path d="M483 60H524" stroke="#c9a84c" stroke-width="3" marker-end="url(#arrowG)"/>
      <g transform="translate(540)"><rect width="198" height="120" fill="#1d1d13" stroke="#88753b"/><text x="16" y="29" fill="#c9a84c" font-size="10">FLOOR 03</text><text x="16" y="60" fill="#d5dad7" font-size="16">PERKS × 3</text><text x="16" y="87" fill="#738078" font-size="11">KEYSTONE ELIGIBLE</text></g>
      <path d="M753 60H794" stroke="#c9a84c" stroke-width="3" marker-end="url(#arrowG)"/>
      <g transform="translate(810)"><rect width="198" height="120" fill="#211e12" stroke="#a28640"/><text x="16" y="29" fill="#d0ad4f" font-size="10">FLOOR 04</text><text x="16" y="60" fill="#d5dad7" font-size="16">PERKS × 4</text><text x="16" y="87" fill="#738078" font-size="11">BUILD DEFINING</text></g>
      <path d="M1023 60H1064" stroke="#c9a84c" stroke-width="3" marker-end="url(#arrowG)"/>
      <g transform="translate(1080)"><rect width="250" height="120" fill="#251f10" stroke="#c9a84c"/><text x="16" y="29" fill="#d0ad4f" font-size="10">FLOOR 05</text><text x="16" y="60" fill="#fff" font-size="16">PERKS × 5 / MAX</text><text x="16" y="87" fill="#877c5d" font-size="11">FULL RUN IDENTITY</text></g>
    </g>
  </g>

  <g transform="translate(48 389)" font-family="ui-monospace,monospace">
    <rect width="1404" height="240" fill="#0e1112" stroke="#344149"/>
    <text x="24" y="35" fill="#7f9eab" font-size="11" letter-spacing="2">ROGUE-LITE / PERSISTS BETWEEN SHIFTS</text>
    <g transform="translate(24 68)">
      <g><rect width="278" height="125" fill="#14191b" stroke="#40535b"/><text x="16" y="29" fill="#7f9eab" font-size="10">FIND</text><text x="16" y="60" fill="#d5dad7" font-size="16">INSTANCED LOOT</text><text x="16" y="88" fill="#748087" font-size="11">WEAPON · ARMOR · TRINKET</text></g>
      <path d="M294 62H357" stroke="#7f9eab" stroke-width="3" marker-end="url(#arrowB)"/>
      <g transform="translate(373)"><rect width="278" height="125" fill="#14191b" stroke="#40535b"/><text x="16" y="29" fill="#7f9eab" font-size="10">RISK</text><text x="16" y="60" fill="#d5dad7" font-size="16">EXTRACT IT</text><text x="16" y="88" fill="#748087" font-size="11">UNBANKED UNTIL THE EXIT</text></g>
      <path d="M667 62H730" stroke="#7f9eab" stroke-width="3" marker-end="url(#arrowB)"/>
      <g transform="translate(746)"><rect width="278" height="125" fill="#14191b" stroke="#40535b"/><text x="16" y="29" fill="#7f9eab" font-size="10">EQUIP</text><text x="16" y="60" fill="#d5dad7" font-size="16">BOUNDED STATS</text><text x="16" y="88" fill="#748087" font-size="11">POWER · GUARD · HASTE...</text></g>
      <path d="M1040 62H1103" stroke="#7f9eab" stroke-width="3" marker-end="url(#arrowB)"/>
      <g transform="translate(1119)"><rect width="211" height="125" fill="#14191b" stroke="#557080"/><text x="16" y="29" fill="#7f9eab" font-size="10">MASTER</text><text x="16" y="60" fill="#d5dad7" font-size="16">WIDER POOL</text><text x="16" y="88" fill="#748087" font-size="11">UNLOCK PERKS</text></g>
    </g>
  </g>
</svg>
